name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://gkurwysglbuofrvjhwlq.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://gkurwysglbuofrvjhwlq.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AptiClash.apk
          ls -lh AptiClash.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AptiClash-Android-APK
          path: AptiClash.apk
          retention-days: 30

      - name: Create / Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "AptiClash - Latest Android APK Build"
          body: |
            ### 🎮 AptiClash Mobile App — Direct Download

            Download and install the latest Android APK directly on your phone:
            - **File**: `AptiClash.apk`
            - **Commit**: ${{ github.sha }}
            - **Built on**: ${{ github.event.head_commit.timestamp || 'Latest' }}

            #### Installation Instructions:
            1. Download `AptiClash.apk` to your Android device.
            2. Tap the downloaded file to install. (If prompted, allow *"Install from Unknown Sources"* for your browser/file manager).
            3. Open **AptiClash** and enjoy self-study pathways, 1v1 splitscreen & online duels!
          files: AptiClash.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
