name: Deploy Web Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Web Bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: "https://gkurwysglbuofrvjhwlq.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_7xR38UkPru464YPMvm5IMA_ZP6WDeR4"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
